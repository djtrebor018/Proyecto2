<div class="registro-container d-flex justify-content-center align-items-center">
  <form  [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <div class="text-center mb-4">
      <img src="assets/Logo.jpeg" alt="Logo" class="mb-3" style="max-width: 120px;">
      <h2>Registro</h2>
    </div>
     @if (errorMessage) {
  <div class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>
}

    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" class="form-control" id="nombre" formControlName="Nombre">
    </div>

    <div class="mb-3">
      <label for="correo" class="form-label">Correo</label>
      <input type="email" class="form-control" id="correo" formControlName="Correo">
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <div class="input-group">
        <input [type]="mostrarPassword ? 'text' : 'password'" class="form-control" id="password" formControlName="Password">
        <span class="input-group-text" style="cursor: pointer;" (click)="mostrarPassword = !mostrarPassword">
          <i class="bi" [ngClass]="mostrarPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
        </span>
      </div>
    </div>

    <div class="mb-3">
      <label for="tipoUsuario" class="form-label">Tipo de usuario</label>
      <select class="form-select" id="tipoUsuario" formControlName="Tipo_Usuario">
        <option value="" disabled selected>Selecciona una opción</option>
        <option value="Estudiante">Estudiante</option>
        <option value="Maestro">Maestro</option>
        <option value="Externo">Externo</option>
      </select>
    </div>

    @if (registroForm.get('Tipo_Usuario')?.value === 'Estudiante' || registroForm.get('tipoUsuario')?.value === 'Maestro' ) {
      <div class="mb-3">
        <label for="matricula" class="form-label">Matrícula</label>
        <input type="text" class="form-control" id="matricula" formControlName="Matricula">
      </div>
    }

    @if (registroForm.get('tipoUsuario')?.value === 'Externo') {
      <div class="mb-3">
        <label for="cedula" class="form-label">Cédula</label>
        <input type="text" class="form-control" id="cedula" formControlName="Cedula">
      </div>
    }
    <div class="d-flex justify-content-between">
      <button type="submit" class="btn btn-success" >Registrarse</button>
      <button type="button" class="btn btn-outline-success" routerLink="">Volver al login</button>
    </div>
  </form>
</div>
