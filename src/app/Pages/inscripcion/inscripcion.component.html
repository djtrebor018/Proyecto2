<!-- Aquí va tu card del horario (Lunes y Miércoles, 10:00 - 11:00, etc.) -->

<div class="container my-3">
  <div class="card shadow-sm">
    <div class="card-header fw-bold">Método de pago</div>

    <form class="card-body" [formGroup]="MetodoForm" (ngSubmit)="pagar()">

      @if (pagoExitoso) {
        <div class="alert alert-success" role="alert">
          ¡Pago realizado con éxito! Redirigiendo al dashboard...
        </div>
      }

      <label for="Metodo_Pago" class="form-label">Selecciona cómo quieres pagar</label>
      <select class="form-select mb-3" id="Metodo_Pago" formControlName="Metodo_Pago">
        <option value="" disabled>Selecciona una opción de pago</option>
        <option value="Tarjeta">Tarjeta</option>
        <option value="Paypal">PayPal</option>
      </select>

      @if (MetodoForm.get('Metodo_Pago')?.value === 'Tarjeta') {
        <hr class="my-3">

        <div class="mb-3">
          <label for="titular" class="form-label">Titular de la tarjeta</label>
          <input id="titular" type="text" class="form-control" placeholder="Nombre como aparece en la tarjeta">
        </div>

        <div class="mb-3">
          <label for="numero" class="form-label">Número de tarjeta</label>
          <input id="numero" type="text" class="form-control" placeholder="0000 0000 0000 0000">
        </div>

        <div class="row g-3 mb-4">
          <div class="col-6">
            <label for="vencimiento" class="form-label">Fecha de expiración</label>
            <input id="vencimiento" type="text" class="form-control" placeholder="MM/AA">
          </div>
          <div class="col-6">
            <label for="cvv" class="form-label">CVV</label>
            <input id="cvv" type="password" class="form-control" placeholder="123">
          </div>
        </div>

        <button type="submit" class="btn btn-gold fw-bold w-100" [disabled]="pagoExitoso">
          Pagar
        </button>
      }

      @if (MetodoForm.get('Metodo_Pago')?.value === 'Paypal') {
        <hr class="my-3">

        <div id="paypal-container" class="paypal-box">
          <button type="button" class="btn w-100 fw-bold"
                  style="background:#FFC439; color:#003087;"
                  [disabled]="pagoExitoso" (click)="pagar()">
            Pagar con PayPal
          </button>
        </div>
      }

    </form>
  </div>
</div>
