<main class="container py-4" aria-labelledby="admin-backup-title">
  <header class="mb-4">
    <p class="text-success text-uppercase fw-semibold small mb-2">{{ 'ADMIN.TITLE' | translate }}</p>
    <h1 id="admin-backup-title" class="display-6 fw-bold mb-0">{{ 'ADMIN.BACKUP_TITLE' | translate }}</h1>
  </header>

  <section class="card border-0 shadow-sm" aria-labelledby="backup-card-title">
    <div class="card-body p-3 p-md-4">
      <h2 id="backup-card-title" class="h4 fw-semibold mb-2">{{ 'ADMIN.BACKUP_CARD_TITLE' | translate }}</h2>
      <p class="text-secondary">{{ 'ADMIN.BACKUP_DESCRIPTION' | translate }}</p>

      @if (error) {
        <div class="alert alert-danger" role="alert">{{ error | translate }}</div>
      }

      <button type="button" class="btn btn-success" (click)="descargarBackup()" [disabled]="descargando">
        @if (descargando) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          {{ 'ADMIN.BACKUP_DOWNLOADING' | translate }}
        } @else {
          <i class="bi bi-database-down me-2" aria-hidden="true"></i>
          {{ 'ADMIN.BACKUP_DOWNLOAD' | translate }}
        }
      </button>
    </div>
  </section>
</main>
