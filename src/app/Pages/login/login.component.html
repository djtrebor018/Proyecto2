<div class="login-container d-flex justify-content-center align-items-center">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" >
    <div class="text-center mb-4">
      <img src="\assets\Logo.jpeg" alt="Logo" class="mb-3" style="max-width: 120px;">
      <h2>Login</h2>
    </div>
    @if (errorMessage) {
  <div class="alert alert-danger" role="alert">
    {{ errorMessage }}
  </div>
}

    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Correo</label>
      <input type="email" class="form-control" id="exampleInputEmail1" formControlName="Correo" aria-describedby="emailHelp">
    </div>
 <div class="mb-3">
  <label for="exampleInputPassword1" class="form-label">Password</label>
  <div class="input-group">
    <input
      [type]="mostrarPassword ? 'text' : 'password'"
      class="form-control"
      id="exampleInputPassword1"
      formControlName="Password">
    <span class="input-group-text" style="cursor: pointer;" (click)="mostrarPassword = !mostrarPassword">
      <i class="bi" [ngClass]="mostrarPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
    </span>
  </div>
</div>

    <div class="d-flex justify-content-between">
      <button type="submit" class="btn btn-success" type="submit">Login</button>
      <button type="button" class="btn btn-outline-success" routerLink="/registro" >Registro</button>
    </div>
  </form> 
</div>
